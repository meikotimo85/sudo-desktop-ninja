<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Sudo – Werkzeugkasten</title>
<style>
  @font-face { font-family: "Pixelify Sans"; font-weight: 700;
    src: url("../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2") format("woff2"); }
  :root { --bg:#12161f; --side:#0e1219; --card:#181d28; --line:#2b3344; --fg:#e3e8f0; --muted:#8a94a6; --teal:#25d3d0; --ok:#3ccf7a; --bad:#ff6b70; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; display: grid; grid-template-columns: 178px 1fr; }
  nav { background: var(--side); border-right: 1px solid var(--line); padding: 14px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  nav h1 { margin: 0 8px 12px; font: 700 20px "Pixelify Sans", monospace; }
  nav h1 span { color: var(--teal); }
  nav button { text-align: left; background: none; border: 0; color: var(--muted); padding: 7px 10px; border-radius: 6px; font: 500 13.5px "Segoe UI", sans-serif; cursor: pointer; }
  nav button:hover { background: #1a2130; color: var(--fg); }
  nav button[aria-selected="true"] { background: #1f2a3a; color: var(--fg); box-shadow: inset 3px 0 0 var(--teal); }
  nav .hint { margin-top: auto; padding: 8px 10px 0; font-size: 11.5px; color: var(--muted); }
  main { padding: 18px 20px; overflow-y: auto; min-width: 0; }
  h2 { margin: 0 0 4px; font: 600 17px "Segoe UI", sans-serif; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #0e1218; color: var(--fg); font: 13px Consolas, ui-monospace, monospace; }
  textarea { min-height: 90px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--fg); margin: 0; }
  .chk input { accent-color: var(--teal); }
  input[type=range] { accent-color: var(--teal); flex: 1; }
  button.act { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: #222938; color: var(--fg); font: 600 13px "Segoe UI", sans-serif; cursor: pointer; }
  button.act.primary { background: var(--teal); border-color: var(--teal); color: #062424; }
  .out { margin-top: 12px; display: grid; gap: 6px; }
  .res { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px 7px 10px; }
  .res .k { font-size: 12px; color: var(--muted); }
  .res .v { font: 13px Consolas, ui-monospace, monospace; word-break: break-all; min-width: 0; user-select: text; }
  .res button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; padding: 3px 8px; font: 12px "Segoe UI", sans-serif; cursor: pointer; }
  .res button:hover { color: var(--fg); border-color: #3d4a5f; }
  .big .v { font-size: 16px; color: var(--fg); }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  .meter { height: 6px; border-radius: 3px; background: #0e1218; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; }
  pre.code { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12.5px/1.45 Consolas, ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; user-select: text; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="jp-font.css">
</head>
<body>
  <nav id="nav" role="tablist">
    <h1><span>sudo</span> tools</h1>
    <button data-t="pw">Passwort</button>
    <button data-t="guid">GUID</button>
    <button data-t="subnet">Subnetz-Rechner</button>
    <button data-t="time">Zeitstempel</button>
    <button data-t="b64">Base64 / URL</button>
    <button data-t="hash">Hash</button>
    <button data-t="json">JSON</button>
    <button data-t="jwt">JWT-Token</button>
    <div class="hint">Strg+Alt+K öffnet dieses Fenster. Esc schließt es. Alles läuft offline auf deinem PC.</div>
  </nav>
  <main id="main"></main>
  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/ja.js"></script>
  <script src="tools-window.js"></script>
</body>
</html>
