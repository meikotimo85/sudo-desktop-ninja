<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Sudo – Frag Sudo</title>
<style>
  @font-face { font-family: "Pixelify Sans"; font-weight: 700;
    src: url("../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2") format("woff2"); }
  :root { --bg:#12161f; --card:#181d28; --line:#2b3344; --fg:#e3e8f0; --muted:#8a94a6; --teal:#25d3d0; --bad:#ff6b70; --gold:#f4d03f; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header img { width: 34px; height: 34px; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); background: #0e1218; }
  header h1 { margin: 0; font: 700 20px "Pixelify Sans", monospace; flex: 1; }
  header h1 span { color: var(--teal); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: #0e1218; border: 0; color: var(--muted); padding: 5px 10px; font: 500 12.5px "Segoe UI", sans-serif; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--teal); color: #062424; font-weight: 600; }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 5px 9px; cursor: pointer; font: 12.5px "Segoe UI", sans-serif; }
  button.ghost:hover { color: var(--fg); border-color: #3d4a5f; }
  #log { overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; white-space: normal; overflow-wrap: anywhere; user-select: text; }
  .msg.me { align-self: flex-end; background: #1f2a3a; border: 1px solid #2d3b52; white-space: pre-wrap; }
  .msg.sudo { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg.sudo .who { font: 700 12px "Pixelify Sans", monospace; color: var(--teal); display: block; margin-bottom: 2px; }
  .msg.err { border-color: rgba(255,107,112,.5); color: var(--bad); }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg code { font: 12.5px Consolas, ui-monospace, monospace; background: #0e1218; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .code { position: relative; margin: 6px 0 8px; }
  .code pre code { background: none; border: 0; padding: 0; }
  .code pre { margin: 0; padding: 28px 12px 10px; background: #0b0e14; border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 12.5px/1.5 Consolas, ui-monospace, monospace; }
  .code button { position: absolute; top: 6px; right: 6px; background: #222938; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 11.5px "Segoe UI", sans-serif; padding: 2px 7px; cursor: pointer; }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--teal); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 380px; }
  .empty b { display: block; font: 700 18px "Pixelify Sans", monospace; color: var(--fg); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .chips button { background: #1a2130; border: 1px solid var(--line); color: var(--fg); border-radius: 99px; padding: 4px 11px; cursor: pointer; font: 12.5px "Segoe UI", sans-serif; }
  .chips button:hover { border-color: var(--teal); }
  footer { border-top: 1px solid var(--line); padding: 10px 16px 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 52px; max-height: 160px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #0e1218; color: var(--fg); font: 14px/1.45 "Segoe UI", sans-serif; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  #send { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--teal); background: var(--teal); color: #062424; font: 600 14px "Segoe UI", sans-serif; cursor: pointer; }
  #send.stop { background: #2a1d22; color: var(--bad); border-color: rgba(255,107,112,.5); }
  .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
  .foot a { color: var(--teal); cursor: pointer; text-decoration: underline; }
  .off { margin: auto; text-align: center; max-width: 380px; color: var(--muted); }
  .off b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; }
  .off button { margin-top: 12px; padding: 8px 16px; border-radius: 7px; border: 1px solid var(--teal); background: var(--teal); color: #062424; font: 600 13.5px "Segoe UI", sans-serif; cursor: pointer; }
</style>
<link rel="stylesheet" href="jp-font.css">
</head>
<body>
  <header>
    <img src="../assets/icon.png" alt="">
    <h1><span>sudo</span> fragen</h1>
    <div class="seg" id="model" role="group" aria-label="Modell"></div>
    <button class="ghost" id="reset" title="Neues Gespräch">Neu</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <footer>
    <div class="row">
      <textarea id="q" rows="1" placeholder="Frag mich was – z. B. „Wie finde ich gesperrte Konten per PowerShell?“" aria-label="Frage"></textarea>
      <button id="send">Fragen</button>
    </div>
    <div class="foot"><span id="usage"></span><span>Keine Passwörter oder Kundendaten eingeben · <a id="settings">KI-Einstellungen</a></span></div>
  </footer>
  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/ja.js"></script>
  <script src="ask-window.js"></script>
</body>
</html>
