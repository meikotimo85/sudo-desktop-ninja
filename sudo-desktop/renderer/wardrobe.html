<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Sudo – Garderobe</title>
<style>
  @font-face { font-family: "Pixelify Sans"; font-weight: 700;
    src: url("../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2") format("woff2"); }
  :root { --bg:#12161f; --card:#181d28; --line:#2b3344; --fg:#e3e8f0; --muted:#8a94a6; --teal:#25d3d0; --gold:#f4d03f; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; padding: 18px 22px 22px; }
  .top { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
  #big { width: 170px; height: 220px; image-rendering: pixelated; background: linear-gradient(180deg, #0c1222, #1b2848); border: 1px solid var(--line); border-radius: 10px; }
  h1 { margin: 0; font: 700 26px "Pixelify Sans", monospace; }
  h1 span { color: var(--teal); }
  .lead { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
  #count { margin-top: 10px; font: 600 13px Consolas, monospace; color: var(--gold); }
  #event { margin-top: 6px; font-size: 12.5px; color: var(--teal); }
  h2 { margin: 20px 0 8px; font: 600 11.5px "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 9px; display: grid; justify-items: center; gap: 3px; cursor: pointer; text-align: center; font: inherit; color: inherit; }
  .item:hover { border-color: #3e4a62; }
  .item[aria-pressed="true"] { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
  .item:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .item canvas { width: 72px; height: 88px; image-rendering: pixelated; }
  .item b { font-size: 13px; font-weight: 600; }
  .item small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
  .item.locked { cursor: default; }
  .item.locked canvas { filter: brightness(0) opacity(.35); }
  .bar { width: 100%; height: 5px; background: #0e1218; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--gold); }
  .item { position: relative; }
  .tag { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: #12161f; background: var(--teal); border-radius: 4px; padding: 0 5px; }
  .none { display: grid; place-items: center; width: 72px; height: 88px; color: var(--muted); font-size: 26px; }
</style>
<link rel="stylesheet" href="jp-font.css">
</head>
<body>
  <div class="top">
    <canvas id="big" width="170" height="220"></canvas>
    <div>
      <h1><span>sudo</span> Garderobe</h1>
      <p class="lead">Sudo bekommt Geschenke, wenn ihr gemeinsam etwas erreicht. Klick auf ein Teil zum Anziehen, noch mal zum Ausziehen.</p>
      <div id="count"></div>
      <div id="event"></div>
    </div>
  </div>
  <h2>Kopfbedeckung</h2>
  <div class="grid" id="hat"></div>
  <h2>Brille</h2>
  <div class="grid" id="face"></div>
  <h2>Hals &amp; Brust</h2>
  <div class="grid" id="neck"></div>
  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/ja.js"></script>
  <script src="sheet.js"></script>
  <script src="progress.js"></script>
  <script src="wardrobe-window.js"></script>
</body>
</html>
